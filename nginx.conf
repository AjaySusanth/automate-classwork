# WHY Nginx at all?
# Node.js is great at dynamic content but TERRIBLE at serving static files efficiently.
# Nginx serves static files 10-50x faster than Express, with:
#   - Automatic gzip compression
#   - Proper browser caching headers
#   - Connection pooling
# It also acts as a reverse proxy, routing API requests to Node.js.

worker_processes auto;
# 'auto' sets one worker per CPU core — optimal for Container Apps

error_log /var/log/nginx/error.log warn;
pid /run/nginx/nginx.pid;

events {
    worker_connections 1024;
    # Max simultaneous connections per worker
    # 1024 is fine for our scale; production high-traffic sites use 4096+
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ---- Logging ----
    # Combined format gives us: IP, time, request, status, referrer, user-agent
    # Essential for debugging production issues
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    # ---- Performance ----
    sendfile on;
    # sendfile = kernel-level file copy; skips userspace (2x faster)

    keepalive_timeout 65;
    # Keep TCP connections alive for 65s to avoid re-handshake overhead

    # ---- Gzip Compression ----
    # WHY? A React bundle can be 500KB uncompressed, ~120KB gzipped
    # This saves bandwidth and makes the page load 3-4x faster
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/xml+rss text/javascript application/vnd.ms-fontobject
               application/x-font-ttf font/opentype image/svg+xml;

    server {
        listen 80;
        server_name _;

        # ---- Security Headers ----
        # These prevent common web attacks and are checked by security scanners
        add_header X-Content-Type-Options "nosniff" always;
        # Prevents browsers from MIME-sniffing (e.g., treating a JS file as HTML)

        add_header X-Frame-Options "SAMEORIGIN" always;
        # Prevents your site from being embedded in an iframe (clickjacking protection)

        add_header X-XSS-Protection "1; mode=block" always;
        # Enables browser's XSS filter

        # ---- API Reverse Proxy ----
        # Any request to /api/* or /health gets forwarded to the Node.js backend
        location /api/ {
            proxy_pass http://127.0.0.1:3001;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WHY these headers?
            # The Node backend needs to know the REAL client IP (not nginx's 127.0.0.1)
            # X-Forwarded-Proto tells it whether the original request was HTTPS
        }

        location /health {
            proxy_pass http://127.0.0.1:3001;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        # ---- Static Frontend ----
        location / {
            root /usr/share/nginx/html;

            # try_files is CRITICAL for single-page apps (SPAs)
            # WHY? React Router handles routes like /dashboard, /assignments
            # But those are CLIENT-SIDE routes — no actual /dashboard file exists.
            # Without try_files, refreshing on /dashboard would give a 404.
            # This tells Nginx: "Try the exact file, then try it as a directory,
            # and if nothing matches, serve index.html and let React handle the route."
            try_files $uri $uri/ /index.html;
        }

        # ---- Static Asset Caching ----
        # Vite adds content hashes to filenames (e.g., main.a3bc4d.js)
        # So we can safely cache them for 1 year — if content changes, the hash changes
        location /assets/ {
            root /usr/share/nginx/html;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }
}
